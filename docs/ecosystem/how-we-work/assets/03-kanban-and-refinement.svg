<text class="ts" x="50" y="580" fill="#A32D2D">GAP 1 — Refinement ritual</text>
<text class="ts" x="50" y="598" fill="#A32D2D">Maturity levels are named.</text>
<text class="ts" x="50" y="614" fill="#A32D2D">How items get refined 0→4</text>
