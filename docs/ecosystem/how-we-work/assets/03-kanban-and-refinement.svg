<text class="ts" x="40" y="754" fill="#5F5E5A">Legend: columns correspond to status values in task.md frontmatter.</text>
<text class="ts" x="40" y="772" fill="#5F5E5A">Ideas/Shaped = pre-board (lives in feature spec); Ready–Done = board states for TASK-*.md.</text>
<text class="ts" x="40" y="790" fill="#5F5E5A">Maturity 5-in-cycle spans Doing + Review; 6-done coincides with Done + Implementation notes filled.</text>
<text class="ts" x="40" y="808" fill="#5F5E5A">Tech debt: 15–20% of each cycle's capacity reserved (PROCESS.md §3).</text>
<text class="ts" x="40" y="826" fill="#5F5E5A">Continuing in Visual 4b: the per-task build loop (research → plan → annotate → implement).</text>
