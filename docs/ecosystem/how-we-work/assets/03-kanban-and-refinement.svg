<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 840" role="img" font-family="'Inter', 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Execution axis part 4a — backlog refinement and kanban flow as a single left-to-right sequence of maturity levels 0 through 4 feeding the six-column kanban board, with maturity 5 and 6 annotations showing how the YAML flag continues to advance while the item is on the board and when it leaves</title>
<desc>Top row shows all five maturity levels 0 through 4 as a single unbroken flow with arrows between each. The 4 Ready box marks the DoR gate at the right end of the row. Middle shows the six-column kanban board below with columns Ideas Shaped Ready Doing Review Done. Maturity 5 spans Doing and Review; Maturity 6 corresponds to the Done column. Bottom shows six gap boxes flagging documentation gaps around refinement ritual, board mechanic, WIP placement, review queue, multi-agent locking, and discovery workflow.</desc>
