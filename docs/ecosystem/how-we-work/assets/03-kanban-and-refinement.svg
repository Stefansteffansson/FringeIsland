<text class="ts" x="252" y="686" fill="#A32D2D">50+ contributors could grab</text>
<text class="ts" x="252" y="702" fill="#A32D2D">same TASK. assigned_to is the</text>
<text class="ts" x="252" y="718" fill="#A32D2D">obvious hook; no use rule.</text></g>

<g><rect x="444" y="650" width="196" height="76" rx="8" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
