<text class="th" x="40" y="32">Execution axis — part 4a</text>
<text class="ts" x="40" y="50">Backlog refinement and kanban flow. Shows where work lives before and during a cycle.</text>

<text class="th" x="40" y="92">Progressive elaboration — feeds the board</text>
<text class="ts" x="40" y="108">Same FEAT-*.md file carries the item from maturity 0 through 6. YAML flag moves.</text>

