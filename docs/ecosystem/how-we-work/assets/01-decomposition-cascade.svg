<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 800" role="img" font-family="'Inter', 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The decomposition cascade from vision to tasks, with five verticals threading through every level</title>
<desc>Five-level cascade from Vision to Tasks drawn as stacked rows. Five thin vertical columns — Administration, Privacy, Notifications, Observability, Transactions — run through every level to show that verticals are obligations on every tier, not a separate layer. Three unresolved gaps are shown in dashed red: Whisp architectural placement at Level 2, cross-product feature sync at Level 4, and vertical spec scaffolds at the cross-cut.</desc>
<style>
  .t  { font-size: 14px; fill: #3d3d3a; font-weight: 400; }
  .ts { font-size: 12px; fill: #5f5e5a; font-weight: 400; }
  .th { font-size: 14px; fill: #3d3d3a; font-weight: 500; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .t, .c-purple .ts, .c-purple .th { fill: #3C3489; }
  .c-purple .th { fill: #26215C; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .t, .c-teal .ts, .c-teal .th { fill: #085041; }
  .c-teal .th { fill: #04342C; }
  @media (prefers-color-scheme: dark) {
    .t  { fill: #c2c0b6; }
    .ts { fill: #9c9a92; }
    .th { fill: #c2c0b6; }
    .c-purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple .t, .c-purple .ts, .c-purple .th { fill: #CECBF6; }
    .c-purple .th { fill: #EEEDFE; }
    .c-teal rect { fill: #085041; stroke: #5DCAA5; }
    .c-teal .t, .c-teal .ts, .c-teal .th { fill: #9FE1CB; }
    .c-teal .th { fill: #E1F5EE; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="40" y="32">Vertical axis — the decomposition cascade</text>
<text class="ts" x="40" y="50">From ecosystem purpose down to the work that ships. Five verticals thread through every level.</text>

<text class="ts" x="440" y="78" fill="#BA7517" text-anchor="middle">Admin</text>
<text class="ts" x="490" y="78" fill="#BA7517" text-anchor="middle">Priv</text>
<text class="ts" x="540" y="78" fill="#BA7517" text-anchor="middle">Notif</text>
<text class="ts" x="590" y="78" fill="#BA7517" text-anchor="middle">Obs</text>
<text class="ts" x="640" y="78" fill="#BA7517" text-anchor="middle">Trans</text>

<line x1="440" y1="88" x2="440" y2="616" stroke="#BA7517" stroke-width="0.75" stroke-dasharray="3 3" fill="none"/>
<line x1="490" y1="88" x2="490" y2="616" stroke="#BA7517" stroke-width="0.75" stroke-dasharray="3 3" fill="none"/>
<line x1="540" y1="88" x2="540" y2="616" stroke="#BA7517" stroke-width="0.75" stroke-dasharray="3 3" fill="none"/>
<line x1="590" y1="88" x2="590" y2="616" stroke="#BA7517" stroke-width="0.75" stroke-dasharray="3 3" fill="none"/>
<line x1="640" y1="88" x2="640" y2="616" stroke="#BA7517" stroke-width="0.75" stroke-dasharray="3 3" fill="none"/>

<g class="c-purple">
<rect x="40" y="96" width="380" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="58" y="118">L1 — Vision</text>
<text class="ts" x="58" y="138">Why the ecosystem exists. Constitutional.</text>
</g>
<text class="ts" x="400" y="128" text-anchor="end">1</text>

<line x1="230" y1="152" x2="230" y2="172" stroke="#3d3d3a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="40" y="172" width="380" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="58" y="194">L2 — Entities</text>
<text class="ts" x="58" y="214">Products · Platform Core · Domain Services ·</text>
<text class="ts" x="58" y="232">Studios · Design System · Verticals</text>
</g>
<text class="ts" x="400" y="204" text-anchor="end">2</text>

<line x1="230" y1="252" x2="230" y2="272" stroke="#3d3d3a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="40" y="272" width="380" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="58" y="294">L3 — Capabilities</text>
<text class="ts" x="58" y="314">What's needed, who owns it, what depends</text>
<text class="ts" x="58" y="332">on what. The most-skipped level.</text>
</g>
<text class="ts" x="400" y="304" text-anchor="end">3</text>

<line x1="230" y1="352" x2="230" y2="372" stroke="#3d3d3a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="40" y="372" width="380" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="58" y="394">L4 — Features (stories embedded)</text>
<text class="ts" x="58" y="414">FEAT-*.md under owner. Maturity 0 to 6.</text>
<text class="ts" x="58" y="432">One owner · consumers · Given/When/Then.</text>
<text class="ts" x="58" y="450">Vertical Impact addressed on every spec.</text>
</g>
<text class="ts" x="400" y="404" text-anchor="end">4</text>

<line x1="230" y1="468" x2="230" y2="488" stroke="#3d3d3a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="40" y="488" width="380" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="58" y="510">L5 — Tasks</text>
<text class="ts" x="58" y="530">TASK-*.md in planning backlog. Ephemeral.</text>
<text class="ts" x="58" y="548">One task, one session.</text>
</g>
<text class="ts" x="400" y="520" text-anchor="end">5</text>

<text class="ts" x="40" y="600" fill="#BA7517">Verticals apply as obligations on every tier (ADR-U002) — they are not a level of their own.</text>

<g>
<rect x="40" y="652" width="290" height="60" rx="8" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="50" y="670" fill="#A32D2D">GAP — Whisp placement (L2)</text>
<text class="ts" x="50" y="688" fill="#A32D2D">Named in Vision, no L2 owner.</text>
<text class="ts" x="50" y="704" fill="#A32D2D">Intelligence? World Model? Cross?</text>
</g>

<g>
<rect x="350" y="652" width="290" height="60" rx="8" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="360" y="670" fill="#A32D2D">GAP — Cross-product feature sync (L4)</text>
<text class="ts" x="360" y="688" fill="#A32D2D">Paired specs are defined; keeping them</text>
<text class="ts" x="360" y="704" fill="#A32D2D">in sync as either evolves is not.</text>
</g>

<g>
<rect x="40" y="724" width="600" height="60" rx="8" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="50" y="742" fill="#A32D2D">GAP — Vertical specs are scaffolds (cross-cut)</text>
<text class="ts" x="50" y="760" fill="#A32D2D">Five spec files exist; §3 (tier obligations), §4 (DoD checklists), §5 (tooling), §6 (failure modes)</text>
<text class="ts" x="50" y="776" fill="#A32D2D">all marked "to be refined." Feature specs fill Vertical Impact against stubs.</text>
</g>
</svg>