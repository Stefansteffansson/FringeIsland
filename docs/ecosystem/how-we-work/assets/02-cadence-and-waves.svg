<text class="ts" x="575" y="600" text-anchor="middle">3 weeks · build</text></g>

<text class="ts" x="40" y="632" fill="#5F5E5A">WIP limit 3 at REVIEW stage — parallelism during build is fine; review is the bottleneck</text>
<text class="ts" x="40" y="648" fill="#5F5E5A">Items from any wave can coexist in a single cycle</text>

<text class="th" x="40" y="688">Retro cadence — four scales, one template</text>
<text class="ts" x="40" y="704">Each retro nests inside the next. Template: docs/templates/retrospective.md</text>

<g class="c-blue"><rect x="40" y="720" width="140" height="48" rx="6" stroke-width="0.5"/>
