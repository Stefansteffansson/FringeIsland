<text class="ts" x="110" y="758" text-anchor="middle">intention + log ~8 min</text></g>
<line x1="180" y1="744" x2="200" y2="744" stroke="#3d3d3a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
