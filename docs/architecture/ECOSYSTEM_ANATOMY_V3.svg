<svg width="680" height="980" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; }
      .label-sm { font-size: 11px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Design System band -->
  <rect x="40" y="14" width="600" height="24" rx="6" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="340" y="30" text-anchor="middle" class="ts" fill="#72243E">Design system — visual language, components, world aesthetic, i18n, a11y</text>

  <!-- Products -->
  <rect x="40" y="50" width="138" height="50" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="109" y="68" text-anchor="middle" class="th" fill="#2C2C2A">The Hub</text>
  <text x="109" y="84" text-anchor="middle" class="ts" fill="#5F5E5A">Web</text>

  <rect x="186" y="50" width="196" height="50" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="284" y="68" text-anchor="middle" class="th" fill="#2C2C2A">The Gimbal</text>
  <text x="284" y="84" text-anchor="middle" class="ts" fill="#5F5E5A">iOS + Android</text>

  <rect x="390" y="50" width="74" height="50" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="427" y="72" text-anchor="middle" class="th" fill="#2C2C2A">The Game</text>

  <!-- Studios -->
  <rect x="472" y="50" width="168" height="50" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
