  <rect x="40" y="548" width="600" height="22" rx="4" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="340" y="563" text-anchor="middle" class="ts" fill="#5F5E5A">Internal API — domain-to-core contract boundary</text>

