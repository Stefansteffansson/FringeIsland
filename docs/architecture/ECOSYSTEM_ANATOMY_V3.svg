  <rect x="60" y="420" width="564" height="42" rx="6" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="342" y="436" text-anchor="middle" class="th" fill="#26215C">Extension system</text>
  <text x="342" y="452" text-anchor="middle" class="ts" fill="#534AB7">Step types, content renderers, AI providers, integrations, plugin registry</text>

