  <rect x="60" y="626" width="280" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="200" y="646" text-anchor="middle" class="th" fill="#04342C">Organisation</text>
  <text x="200" y="664" text-anchor="middle" class="ts" fill="#0F6E56">Groups, memberships, roles, perms</text>

  <!-- PC-2: Identity -->
  <rect x="354" y="626" width="270" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="489" y="646" text-anchor="middle" class="th" fill="#04342C">Identity</text>
  <text x="489" y="664" text-anchor="middle" class="ts" fill="#0F6E56">Auth, profile, sessions</text>

  <!-- PC-1: Infrastructure -->
  <rect x="60" y="696" width="564" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="342" y="716" text-anchor="middle" class="th" fill="#04342C">Infrastructure</text>
  <text x="342" y="734" text-anchor="middle" class="ts" fill="#0F6E56">Supabase, PostgreSQL, RLS, Storage, pg_cron, feature flags, email, backup</text>

  <!-- PC-4: Governance -->
  <rect x="60" y="766" width="564" height="42" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="342" y="782" text-anchor="middle" class="th" fill="#04342C">Governance</text>
  <text x="342" y="798" text-anchor="middle" class="ts" fill="#0F6E56">DeusEx policies, platform rules, tenant configuration</text>

  <!-- Verticals label -->
  <text x="40" y="868" class="ts" fill="#888780">Cross-cutting verticals — touch every layer simultaneously</text>

  <!-- V1-V5 -->
  <rect x="40" y="880" width="110" height="36" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="95" y="902" text-anchor="middle" class="ts" fill="#501313">Admin</text>

  <rect x="158" y="880" width="110" height="36" rx="6" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="213" y="902" text-anchor="middle" class="ts" fill="#4B1528">Privacy / GDPR</text>

  <rect x="276" y="880" width="110" height="36" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="331" y="902" text-anchor="middle" class="ts" fill="#412402">Notifications</text>

  <rect x="394" y="880" width="110" height="36" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="449" y="902" text-anchor="middle" class="ts" fill="#042C53">Observability</text>

  <rect x="512" y="880" width="128" height="36" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="576" y="902" text-anchor="middle" class="ts" fill="#173404">Transactions</text>

  <!-- Title and version -->
  <text x="340" y="950" text-anchor="middle" font-size="11" fill="#888780" font-family="Arial, sans-serif">FringeIsland Ecosystem Anatomy v2.1 — April 2026</text>
  <text x="340" y="966" text-anchor="middle" font-size="11" fill="#888780" font-family="Arial, sans-serif">Designed for open-source extensibility and parallel contribution</text>
