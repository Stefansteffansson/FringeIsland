  <rect x="40" y="586" width="600" height="250" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="610" text-anchor="middle" class="th" fill="#085041">Platform core — domain-agnostic foundation, stability over speed</text>

