  <rect x="254" y="350" width="180" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="344" y="370" text-anchor="middle" class="th" fill="#26215C">Discovery</text>
  <text x="344" y="388" text-anchor="middle" class="ts" fill="#534AB7">Search, marketplace</text>

