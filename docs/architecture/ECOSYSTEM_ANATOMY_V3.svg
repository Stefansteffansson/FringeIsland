  <rect x="448" y="350" width="176" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="536" y="370" text-anchor="middle" class="th" fill="#26215C">Intelligence</text>
  <text x="536" y="388" text-anchor="middle" class="ts" fill="#534AB7">AI mentor, insights</text>

