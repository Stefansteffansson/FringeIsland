  <rect x="60" y="280" width="280" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="200" y="300" text-anchor="middle" class="th" fill="#26215C">Experience engine</text>
  <text x="200" y="318" text-anchor="middle" class="ts" fill="#534AB7">Journeys, steps, progress, enrolments</text>

