  <rect x="354" y="210" width="270" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="489" y="230" text-anchor="middle" class="th" fill="#26215C">Narrative engine</text>
  <text x="489" y="248" text-anchor="middle" class="ts" fill="#534AB7">Seasons, episodes, story beats</text>

