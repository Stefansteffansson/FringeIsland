<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" class="th" fill="#2C2C2A">Domain service dependencies — who reads from whom</text>

  <!-- DS-1: World Model -->
  <rect x="200" y="46" width="280" height="52" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="64" text-anchor="middle" class="th" fill="#26215C">World model</text>
  <text x="340" y="82" text-anchor="middle" class="ts" fill="#534AB7">Constrains everything below</text>
  <text x="520" y="72" class="ts" fill="#888780">Universe Studio writes</text>

  <!-- Arrows from World Model -->
  <line x1="280" y1="98" x2="200" y2="138" stroke="#7F77DD" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="400" y1="98" x2="480" y2="138" stroke="#7F77DD" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>

  <!-- DS-2: Narrative Engine -->
  <rect x="100" y="140" width="200" height="52" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="200" y="158" text-anchor="middle" class="th" fill="#712B13">Narrative engine</text>
  <text x="200" y="176" text-anchor="middle" class="ts" fill="#993C1D">Seasons, episodes, arcs</text>
  <text x="40" y="166" class="ts" fill="#888780">Arc Studio</text>
  <text x="40" y="180" class="ts" fill="#888780">writes</text>

  <!-- DS-4: Content -->
  <rect x="380" y="140" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="480" y="158" text-anchor="middle" class="th" fill="#042C53">Content</text>
  <text x="480" y="176" text-anchor="middle" class="ts" fill="#185FA5">Media, assets, blocks</text>
  <text x="620" y="166" class="ts" fill="#888780">Shared</text>
  <text x="620" y="180" class="ts" fill="#888780">resource</text>

  <!-- Arrows from Narrative + Content -->
  <line x1="200" y1="192" x2="200" y2="238" stroke="#993C1D" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="480" y1="192" x2="350" y2="238" stroke="#185FA5" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="480" y1="192" x2="480" y2="310" stroke="#185FA5" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>

  <!-- DS-3: Experience Engine -->
  <rect x="100" y="240" width="260" height="52" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="230" y="258" text-anchor="middle" class="th" fill="#04342C">Experience engine</text>
  <text x="230" y="276" text-anchor="middle" class="ts" fill="#0F6E56">Journeys, steps, progress</text>
  <text x="400" y="266" class="ts" fill="#888780">Journey Studio writes</text>

  <!-- Arrows from Experience Engine -->
  <line x1="180" y1="292" x2="130" y2="380" stroke="#0F6E56" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="280" y1="292" x2="340" y2="380" stroke="#0F6E56" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="320" y1="292" x2="520" y2="380" stroke="#0F6E56" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>

  <!-- DS-5: Communication -->
  <rect x="40" y="382" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="125" y="400" text-anchor="middle" class="th" fill="#2C2C2A">Communication</text>
  <text x="125" y="418" text-anchor="middle" class="ts" fill="#5F5E5A">DM, forums, feeds</text>

  <!-- DS-6: Discovery -->
  <rect x="256" y="382" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="341" y="400" text-anchor="middle" class="th" fill="#2C2C2A">Discovery</text>
  <text x="341" y="418" text-anchor="middle" class="ts" fill="#5F5E5A">Search, marketplace</text>

  <!-- DS-7: Intelligence -->
  <rect x="472" y="312" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="557" y="330" text-anchor="middle" class="th" fill="#2C2C2A">Intelligence</text>
  <text x="557" y="348" text-anchor="middle" class="ts" fill="#5F5E5A">AI mentor, insights</text>

  <!-- Arrows from Intelligence -->
  <line x1="557" y1="364" x2="400" y2="382" stroke="#888780" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="557" y1="364" x2="557" y2="452" stroke="#888780" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Extension System -->
  <rect x="160" y="460" width="360" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="340" y="478" text-anchor="middle" class="th" fill="#412402">Extension system</text>
  <text x="340" y="494" text-anchor="middle" class="ts" fill="#854F0B">Plugin contracts registered by all services above</text>

  <!-- Internal API boundary -->
  <rect x="100" y="530" width="480" height="22" rx="4" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="340" y="546" text-anchor="middle" class="ts" fill="#5F5E5A">Internal API boundary</text>

  <!-- Platform Core -->
  <rect x="100" y="564" width="480" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="586" text-anchor="middle" class="th" fill="#04342C">Platform core — Organisation, Identity, Infrastructure, Governance</text>
</svg>
