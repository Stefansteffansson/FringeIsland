  <text x="343" y="648" text-anchor="middle" class="label-sm" fill="#534AB7">Permanent (member)</text>
  <text x="243" y="666" text-anchor="middle" class="label-sm" fill="#534AB7">Profile · profile_data · Sessions</text>

  <!-- L0: Infrastructure -->
  <rect x="56" y="692" width="374" height="68" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
