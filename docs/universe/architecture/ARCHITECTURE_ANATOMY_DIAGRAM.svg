  <text x="170" y="730" text-anchor="middle" class="label-sm" fill="#444441">Supabase · PostgreSQL · Auth</text>
  <text x="350" y="730" text-anchor="middle" class="label-sm" fill="#444441">RLS · Storage · pg_cron</text>
  <text x="170" y="748" text-anchor="middle" class="label-sm" fill="#444441">Feature flags · i18n config</text>
  <text x="350" y="748" text-anchor="middle" class="label-sm" fill="#444441">Email · AI provider · Backup →</text>

