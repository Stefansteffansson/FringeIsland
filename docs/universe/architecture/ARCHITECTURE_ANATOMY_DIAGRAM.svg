  <line x1="430" y1="262" x2="440" y2="262" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="430" y1="322" x2="440" y2="322" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="430" y1="394" x2="440" y2="394" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="430" y1="488" x2="440" y2="488" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="430" y1="570" x2="440" y2="570" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="430" y1="642" x2="440" y2="642" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="430" y1="726" x2="440" y2="726" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 3"/>

