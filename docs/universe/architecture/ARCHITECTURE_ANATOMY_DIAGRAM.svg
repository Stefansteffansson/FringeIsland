  <rect x="570" y="180" width="34" height="580" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/>
  <text x="587" y="470" text-anchor="middle" class="label-md" fill="#173404" transform="rotate(90,587,470)">Transactions · Stripe →</text>

  <!-- LOCKED badge -->
  <rect x="612" y="180" width="50" height="28" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="637" y="199" text-anchor="middle" class="label-md" fill="#085041">v1 LOCKED</text>

  <!-- Legend -->
  <text x="56" y="830" class="label-sm" fill="#666">→  known future concern — grows over time</text>
  <text x="56" y="848" class="label-sm" fill="#666">Layers: L0 is the ground — nothing above exists without everything below</text>
  <text x="56" y="866" class="label-sm" fill="#666">Verticals: cross-cutting concerns touching every layer simultaneously</text>
  <text x="56" y="884" class="label-sm" fill="#666">Platform API: frontend contract (Ferd) + API versioning + rate limiting + future extension surface (Hamn)</text>
  <text x="56" y="902" class="label-sm" fill="#666">Design system: shared visual language — i18n and a11y are constraints</text>
  <text x="56" y="920" class="label-sm" fill="#666">L3 Experience engine is the architectural linchpin — spec before building above it</text>

  <!-- Title and version -->
  <text x="340" y="960" text-anchor="middle" font-size="11" fill="#999">FringeIsland Architecture Anatomy v1 — March 2026 — docs/architecture/ARCHITECTURE_ANATOMY.md</text>
