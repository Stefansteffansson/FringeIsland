      .label-md { font-size: 12px; font-weight: 600; }
      .label-lg { font-size: 13px; font-weight: 700; }
      .layer-num { font-size: 11px; fill: #888; }
    </style>
  </defs>

  <!-- DESIGN SYSTEM band -->
