  <text x="85" y="73" text-anchor="middle" class="label-sm">Ferd → Hamn</text>

  <rect x="170" y="44" width="106" height="36" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.8"/>
  <text x="223" y="58" text-anchor="middle" class="label-md" fill="#2C2C2A">iOS app</text>
  <text x="223" y="73" text-anchor="middle" class="label-sm">Hamn+</text>

