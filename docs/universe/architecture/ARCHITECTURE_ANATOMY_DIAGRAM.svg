  <text x="130" y="490" text-anchor="middle" class="label-sm" fill="#185FA5">Journey catalogue</text>
  <text x="243" y="490" text-anchor="middle" class="label-sm" fill="#185FA5">Journey designer</text>
  <text x="376" y="490" text-anchor="middle" class="label-sm" fill="#185FA5">Enrolments</text>
  <text x="130" y="512" text-anchor="middle" class="label-sm" fill="#185FA5">Step types</text>
  <text x="243" y="512" text-anchor="middle" class="label-sm" fill="#185FA5">Progress tracking</text>
  <text x="376" y="512" text-anchor="middle" class="label-sm" fill="#185FA5">Journey Zero</text>

