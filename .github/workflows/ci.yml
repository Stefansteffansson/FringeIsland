# FringeIsland CI — the DB-free gate (Phase-4 board ruling P4-2, option B).
#
# WHAT THIS GATES: `next build` (the APP type gate — ts-jest and eslint do NOT full-type-check;
# PC003 merged build-broken because nothing ran it), `tsc --noEmit` over app + tests
# (TASK-DBT-01 — the test tier is outside `next build`'s program), lint, and the unit project.
#
# WHAT THIS DELIBERATELY DOES NOT RUN: the integration and E2E suites, and the platform
# conformance family. Those need a real Postgres and today there is exactly one shared dev
# database, which local sessions and manual testing also use — CI-driven runs would collide.
# That posture is recorded as deliberate (GC-16), not forgotten. Revisit at Eid with an
# isolated CI database; the conformance family stays a local gate until then
# (`npm run test:integration:platform -w hub`).
#
# The Supabase values below are PLACEHOLDERS, not secrets. They exist only so the build can
# construct clients at module scope; nothing here reaches a real database.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · lint · unit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (workspace-aware)
        run: npm ci

      - name: Lint
        run: npm run lint

      # TASK-DBT-01 (2026-09-02): `next build` type-checks the APP only — tests/ is
      # outside its program, and ts-jest transpiles without checking. The test tier
      # carried 1 099 type errors nobody had seen. `tsc --noEmit` covers app + tests,
      # was cleaned in that task, and is gated here so the debt cannot regrow.
      - name: Type-check (app + tests)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build (the type gate)
        run: npm run build

      # Proves the ROOT tooling keep-set still resolves after the Phase-4 W3
      # split (root is tooling-only; hub/ owns the app deps). The dashboard is
      # the only root-owned consumer, so if its deps are wrong this fails.
      - name: Dashboard generates (root tooling gate)
        run: npm run dashboard
