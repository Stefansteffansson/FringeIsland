# L2 of the 2026-07-09 cold-load analysis (docs/planning/hub-v2/
# 2026-07-09-cold-load-regression-analysis.md §6): after ≥15-20 min of zero
# traffic, Vercel deprovisions the Hub's function environment and the next
# visitor pays a measured 3.7-4.7 s provisioning wave before any function code
# runs. A ping every 5 minutes holds the environment; validated live
# 2026-07-09 — an unauthenticated cookie-less request provisions the heavy
# path itself (3 735 ms, in-function 4 ms), and authenticated requests right
# after land at ~1.2 s instead of 4-7 s.
#
# Mechanism: GitHub Actions because the Vercel project is on Hobby (Vercel
# crons there are daily-only) and this repo is public (scheduled workflows on
# standard runners are free). GitHub cron is best-effort — delays of a few
# minutes under load are normal, so an occasional semi-cold visit remains
# possible. Cost side: ~8.6 K invocations/month against Vercel Hobby's 1 M
# cap, ~4 ms in-function per ping.
#
# Target: /api/me/overview — the permanent sign-in-landing route (the
# /api/perf/probe-* twins are temporary and get removed). The ping is
# unauthenticated (the route's own auth gate answers 401 after the
# environment is provisioned — the expensive part). The dummy cookie routes
# the request through the cookie-bearing middleware path too; it cannot
# authenticate anything.
#
# NOTE: GitHub disables schedules after 60 days without repo activity;
# this repo is active daily. Revisit this workflow when real user traffic
# makes it redundant, or if the platform moves off Vercel (ADR-U036 links).

name: keep-warm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping production (hold the function environment provisioned)
        run: |
          # -D -: dump headers so the run log doubles as a free timing series
          # (x-proxy-timing is content-free by design — numbers only).
          # 401 is the expected, correct answer; only transport failure warns.
          curl -sS -D - -o /dev/null --max-time 30 \
            -H "Cookie: keepwarm=1" \
            "https://fringe-island.vercel.app/api/me/overview" \
            | grep -iE 'x-proxy-timing|^HTTP' \
            || echo "::warning::keep-warm ping failed (transport)"
